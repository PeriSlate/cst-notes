name: Publish Obsidian release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Verify release metadata and runtime
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "$(node -p "require('./manifest.json').version")"
          test "$(node -p "require('./versions.json')[require('./manifest.json').version]")" = "$(node -p "require('./manifest.json').minAppVersion")"
          node --check main.js

      # Attests distribution bytes from this public tag, not a private-source build.
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ github.workspace }}/main.js
            ${{ github.workspace }}/manifest.json
            ${{ github.workspace }}/styles.css

      - name: Publish required Obsidian assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "CST Notes $GITHUB_REF_NAME" \
            --notes-file RELEASE-NOTES.md \
            main.js manifest.json styles.css
