name: One-time 0.1.11 onboarding correction

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: one-time-cst-onboarding-0.1.11
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'PeriSlate/cst-notes' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: PeriSlate/cst-notes
      RELEASE_VERSION: '0.1.11'
      PREVIOUS_SHA: 1017990093701fa4d3cd38c3a78b34b6707708b3cb0f598a7c70762dd352a855
      APPROVED_SHA: fd279bc4c17b582ed0483f126681f43fde6cb6525d946a39471b290d28e4d22a
      ORIGINAL_TAG_COMMIT: a5e563812a72c774872c0cc98c16a195f5ec8288
    steps:
      - uses: actions/checkout@v4

      - name: Check fixed scope and preserve original release
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          test "$ORIGINAL_TAG_COMMIT" = "$(gh api "repos/$GH_REPO/commits/$RELEASE_VERSION" --jq .sha)"
          test "$RELEASE_VERSION" = "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          test "$RELEASE_VERSION" = "$(node -p "require('./manifest.json').version")"
          test "$(node -p "require('./versions.json')[require('./manifest.json').version]")" = "$(node -p "require('./manifest.json').minAppVersion")"
          printf '%s  main.js\n' "$APPROVED_SHA" | sha256sum --check
          node --check main.js
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_VERSION" > "$RUNNER_TEMP/original-release.json"
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/original-release.json"));if(r.immutable||r.draft||r.prerelease||r.tag_name!=="0.1.11"||r.assets.map(a=>a.name).sort().join(",")!=="main.js,manifest.json,styles.css")throw Error("Unexpected release state");fs.writeFileSync(process.env.RUNNER_TEMP+"/original-notes.md",r.body||"");'
          mkdir "$RUNNER_TEMP/original"
          gh release download "$RELEASE_VERSION" --dir "$RUNNER_TEMP/original"
          printf '%s  %s/main.js\n' "$PREVIOUS_SHA" "$RUNNER_TEMP/original" | sha256sum --check
          cmp manifest.json "$RUNNER_TEMP/original/manifest.json"
          cmp styles.css "$RUNNER_TEMP/original/styles.css"

      # Fresh provenance identifies this commit; the original tags are not moved.
      - name: Attest the approved main.js
        uses: actions/attest@v4
        with:
          subject-path: ${{ github.workspace }}/main.js

      - name: Replace only the approved runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          test "$ORIGINAL_TAG_COMMIT" = "$(gh api "repos/$GH_REPO/commits/$RELEASE_VERSION" --jq .sha)"
          test "$RELEASE_VERSION" = "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_VERSION" > "$RUNNER_TEMP/current-release.json"
          node -e 'const fs=require("fs"),p=process.env.RUNNER_TEMP;const a=JSON.parse(fs.readFileSync(p+"/original-release.json")),b=JSON.parse(fs.readFileSync(p+"/current-release.json"));const shape=r=>({id:r.id,body:r.body,immutable:r.immutable,draft:r.draft,prerelease:r.prerelease,assets:r.assets.map(x=>({id:x.id,name:x.name,digest:x.digest})).sort((x,y)=>x.name.localeCompare(y.name))});if(JSON.stringify(shape(a))!==JSON.stringify(shape(b)))throw Error("Release changed during review");'
          mkdir "$RUNNER_TEMP/current"
          gh release download "$RELEASE_VERSION" --dir "$RUNNER_TEMP/current"
          cmp "$RUNNER_TEMP/original/main.js" "$RUNNER_TEMP/current/main.js"
          cmp manifest.json "$RUNNER_TEMP/current/manifest.json"
          cmp styles.css "$RUNNER_TEMP/current/styles.css"
          cp RELEASE-NOTES.md "$RUNNER_TEMP/updated-notes.md"
          printf '\nSilent update provenance: [public commit %s](https://github.com/%s/commit/%s), [workflow run](https://github.com/%s/actions/runs/%s). Original version tags are unchanged. The replacement main.js is attested to this commit, not the original version tag.\n' "$GITHUB_SHA" "$GH_REPO" "$GITHUB_SHA" "$GH_REPO" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/updated-notes.md"
          rollback() {
            trap - ERR
            # Do not overwrite an unknown concurrent replacement during recovery.
            if ! gh api "repos/$GH_REPO/releases/tags/$RELEASE_VERSION" > "$RUNNER_TEMP/rollback-release.json"; then
              echo '::error::Cannot inspect release; original runtime remains recoverable from the unchanged version tag.'
              exit 1
            fi
            if node -e 'const fs=require("fs"),p=process.env.RUNNER_TEMP,r=JSON.parse(fs.readFileSync(p+"/rollback-release.json")),old=JSON.parse(fs.readFileSync(p+"/original-release.json")).assets.find(x=>x.name==="main.js"),a=r.assets.find(x=>x.name==="main.js");const failedUpload=a&&a.state==="starter"&&a.size===0&&a.id!==old.id&&a.uploader?.login==="github-actions[bot]";if(a&&!failedUpload&&a.digest!=="sha256:"+process.env.APPROVED_SHA&&a.digest!=="sha256:"+process.env.PREVIOUS_SHA)process.exit(1);'; then
              if ! node -e 'const fs=require("fs"),r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/rollback-release.json"));if(r.assets.find(x=>x.name==="main.js")?.digest!=="sha256:"+process.env.PREVIOUS_SHA)process.exit(1);'; then
                if ! gh release upload "$RELEASE_VERSION" "$RUNNER_TEMP/original/main.js" --clobber; then
                  echo '::error::Restore original runtime from unchanged version tag.'
                  exit 1
                fi
              fi
              mkdir "$RUNNER_TEMP/restored"
              if ! gh release download "$RELEASE_VERSION" --pattern main.js --dir "$RUNNER_TEMP/restored" || ! cmp "$RUNNER_TEMP/original/main.js" "$RUNNER_TEMP/restored/main.js"; then
                echo '::error::Restored runtime verification failed; original remains in unchanged version tag.'
                exit 1
              fi
              if node -e 'const fs=require("fs"),p=process.env.RUNNER_TEMP,r=JSON.parse(fs.readFileSync(p+"/rollback-release.json"));if(r.body!==fs.readFileSync(p+"/updated-notes.md","utf8"))process.exit(1);'; then
                gh release edit "$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/original-notes.md" || echo '::error::Release notes need recovery.'
              fi
            else
              echo '::error::Release changed externally; automatic rollback refused.'
            fi
            exit 1
          }
          trap rollback ERR
          gh release upload "$RELEASE_VERSION" main.js --clobber
          mkdir "$RUNNER_TEMP/verified"
          gh release download "$RELEASE_VERSION" --dir "$RUNNER_TEMP/verified"
          cmp main.js "$RUNNER_TEMP/verified/main.js"
          cmp manifest.json "$RUNNER_TEMP/verified/manifest.json"
          cmp styles.css "$RUNNER_TEMP/verified/styles.css"
          gh attestation verify "$RUNNER_TEMP/verified/main.js" --repo "$GH_REPO" --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --signer-workflow "$GH_REPO/.github/workflows/silent-onboarding-0-1-11.yml"
          gh release edit "$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/updated-notes.md"
          trap - ERR
